<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INPUTS</title>
    <style>

        label{
            margin-top: 6px;
        }

        input[type="text"],
        input[type="number"]
        input[type="radio"]{
            border:1px solid black;
            font-size:16px;
            box-sizing:border-box;
            width:500px;
        }

       #boton{
            margin-top: 10px;
            padding:6px;
            background-color:auto;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        legend{
            font-weight: bold;
            padding: 0 10px;
        }

        label{
            margin-top: 10px;
            margin-bottom: 5px;
        }

        fieldset{    
            margin: 0 auto;
            padding: 15px;
            border-radius: auto;
        }
    </style>

</head>
<body>

    <h1>Formulário</h1>
    <form action="">

        <fieldset>
            <legend>Dados Pessoais</legend>

        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome"><br><br>

        <label for="end">Endereço:</label>
        <input type="text" name="end" id="end"><br><br>

        <label for="cid">Cidade:</label>
        <input type="text" name="cid" id="cid"><br><br>
        
        <label for="uf">Estado:</label>
        <select id="uf" name="uf">
            <option value="" disabled selected></option>
            <option value="ac">Acre</option>
            <option value="ap">Amapá</option>
            <option value="am">Amazonas</option>
            <option value="pa">Pará</option>
            <option value="ro">Rondônia</option>
            <option value="rr">Roraima</option>
            <option value="to">Tocantins</option>
            <option value="ma">Maranhão</option>
            <option value="pi">Piauí</option>
            <option value="ce">Ceará</option>
            <option value="rn">RIo Grande do Norte</option>
            <option value="pb">Paraíba</option>
            <option value="pe">Pernambuco</option>
            <option value="al">Alagoas</option>
            <option value="se">Sergipe</option>
            <option value="ba">Bahia</option>
            <option value="go">Goiás</option>
            <option value="mt">Mato Grosso</option>
            <option value="ms">Mato Grosso do Sul</option>
            <option value="df">Distrito Federal</option>
            <option value="sp">São Paulo</option>
            <option value="rj">Rio de Janeiro</option>
            <option value="mg">Minas Gerais</option>
            <option value="es">Espírito Santo</option>
            <option value="pr">Paraná</option>
            <option value="sc">Santa Catarina</option>
            <option value="rs">Rio Grande do Sul</option>
        </select>
        </fieldset>
        <br><br>

        <fieldset>
            <legend>Dados Profissionais</legend>
           
            <p>Natureza do cargo</p>
            <input type="radio" id="ger" class="ger" value="ger" name="cargo">
            <label for="ger">Gerência</label>
 
            <input type="radio" id="fin" class="fin" value="fin" name="cargo">
            <label for="fin">Financeiro</label>
            
            <input type="radio" id="rec" class="rec" value="rec" name="cargo">
            <label for="rec">Recepção</label>
            
            <input type="radio" id="adm" class="adm" value="adm" name="cargo">
            <label for="adm">Administrativo</label>
            
            <input type="radio" id="jur" class="jur" value="jur" name="cargo">
            <label for="jur">Juridico</label>
            <br><br>
            
            <p>Área de interesse</p>
            <input type="checkbox" id="func" class="func" nome="funcao">
            <label for="cpt">Computação</label>
            
            <input type="checkbox" id="func" class="func" nome="funcao">
            <label for="blg">Biologia</label>
            
            <input type="checkbox" id="func" class="func" nome="funcao">
            <label for="ma">Meio Ambiente</label>
            
            <input type="checkbox" id="func" class="func" nome="funcao">
            <label for="eng">Engenharia</label>

            <input type="checkbox" id="func" class="func" nome="funcao">
            <label for="his">História</label>
            <br><br>

            <label for="curr">Mini-Curriculo:</label>
            <textarea name="curr" id="curr" rows="5" cols="40"></textarea>
        </fieldset><br>

        <input type="submit" value="Enviar" id="boton">
        <input type="reset" value="Limpar" id="boton">

</form>
</body>
</html>
