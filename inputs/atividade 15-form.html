<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INPUTS</title>
    <style>
        #titulogeral{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>

</head>
<body>
    <h1 id="titulogeral" class="titulogeral">Formulário </h1>
    <br><br>

    <form action="">
    <label for="nome">Insira seu nome completo:</label><br><br>
    <input type="text" id="nome" class="nome" >

    <br><br>
    <label for="senha">Insira sua senha:</label><br><br>
    <input type="password" id="senha" class="senha">

    <br><br>
    <label for="email">Digite seu e-mail:</label><br><br>
    <input type="email" id="email" class="email">

       <br><br>
    <label for="datanasc">Insira sua data de nascimento:</label><br><br>
    <input type="date" id="datanasc" class="datanasc">

    <input type="submit" value="Enviar">
  
</form>
</body>
</html>
