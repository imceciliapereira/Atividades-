<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>

    <style>
        h1{
            text-align: center;
            background-color: blue;
            color: white;
        }
        form{
            background: rgba(255,255,255, 0.30);
            max-width: 600px ;          
            margin-left: 35%;
            margin-top: 10%;
            border-radius: 4%;  
            display: inline-block; 
            padding: 16px;     
            font-family: Arial, Helvetica, sans-serif,;
        }
        body{
            background-image: url('mundo.jpg'); 
            background-size: cover;
            background-repeat: no-repeat; 
            color: black;  
        }
        input, select, button{
            border-radius: 4px;
            border: none;
        }
        #enviar{
            background-color: blue;
            color: white;    
        }
        #emp{
            margin-left: 71px;
            width: 325px;
        }
        #email{
            margin-left: 84px;
            width: 325px;
        }
        #mensagem{
            margin-left: 75px;
            width: 325px;
        }
        #ddd{
            margin-left:2px;
            width: 150px ;
        }
        #tel{
            width:166px ;
        }
        #sx{
            margin-left:95px;
            width:328px ;
        }
        button{
            width: 100px;
        }

    </style>
</head>
<body>  

<form action="https://sheetdb.io/api/v1/jsc3jzsoh8qmc" method="post">

    <h1 id="h1">Formulário de Cadastro</h1><br>

        <label for="nome">Nome e Sobrenome</label>
        <input type="text" id="nome" name="data[nome]" class="nome" placeholder="Nome" >
        <input type="text" id="snome" name="data[snome]" class="snome" placeholder="Sobrenome">
        <br><br>

        <label for="emp">Empresa</label>
        <input type="text" name="data[emp]" id="emp">
        <br><br>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="data[email]" class="email" placeholder="hello@contact.net">
        <br><br>

        <label for="mensagem">Assunto</label>
        <textarea name="data[mensagem]" id="mensagem" rows="5" cols="40"></textarea>
        <br><br>

        <label for="nome">Telefone com DDD</label>
        <input type="tel" id="ddd" name="data[ddd]" class="ddd" placeholder="DDD" >
        <input type="tel" id="tel" name="data[tel]" class="telefone" placeholder="Telefone">
        <br><br>

        <label for="sx">Sexo</label>
        <select id="sx" name="data[sexo]">
            <option value="" disabled selected>-Selecione a opção</option>
            <option value="Feminino">Feminino</option>
            <option value="Masculino
            ">Masculino</option>
        </select>
        <br><br>

         <p>Você esta começando na programação?</p>
            <input type="radio" id="sim" name="data[sim]" class="sim" value="sim" name="sim">
            <label for="sim">Sim</label>
            <input type="radio" id="nao" name="data[nao]" class="nao" value="nao" name="nao">
            <label for="nao">Não</label>
            <br><br>
        <button type="submit" id="enviar"> Enviar </button>

</form>
</body>
</html>
